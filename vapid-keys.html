<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>VAPID key generator</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.5}
textarea{width:100%;height:70px;font-family:monospace;font-size:13px}button{padding:10px 18px;font-size:15px;cursor:pointer}
.warn{background:#fff3cd;padding:10px 14px;border-radius:8px}</style></head><body>
<h1>VAPID key generator</h1>
<p>This page runs only in your browser. Nothing is sent anywhere.</p>
<button id="go">Generate keys</button>
<h3>Public key</h3><p>Goes in <code>config.js</code> as <code>vapid</code> and in Supabase as <code>VAPID_PUBLIC_KEY</code>.</p><textarea id="pub" readonly></textarea>
<h3>Private key</h3><p class="warn">Secret. Put it only in Supabase as <code>VAPID_PRIVATE_KEY</code>. Never put it in config.js, GitHub or a chat.</p><textarea id="priv" readonly></textarea>
<script>
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const fromB64u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
document.getElementById('go').onclick=async()=>{
  const k=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
  const j=await crypto.subtle.exportKey('jwk',k.privateKey);
  const x=fromB64u(j.x),y=fromB64u(j.y),pub=new Uint8Array(65);pub[0]=4;pub.set(x,1);pub.set(y,33);
  document.getElementById('pub').value=b64u(pub);document.getElementById('priv').value=j.d;
};
</script></body></html>
