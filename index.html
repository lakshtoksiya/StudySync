<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudySync</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F6F1E7;--card:#FFFDF8;--ink:#1F2A37;--mut:#6B7280;--line:#E6DFD0;--pri:#4F7A5C;--prih:#3E6249;--soft:#E8F0E6;--coral:#D9603F}
[data-theme=dark]{--bg:#12181D;--card:#1B242B;--ink:#ECEFF1;--mut:#9AA6B0;--line:#2B363F;--pri:#6FA37C;--prih:#82B58E;--soft:#22302A;--coral:#F08A6C}
*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}a{color:inherit}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);background:var(--card)}
.brand{font-weight:800;font-size:21px;letter-spacing:-.03em;padding:4px 10px 14px}.brand b{color:var(--pri)}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.ni{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:9px 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--mut)}
.ni:hover{background:var(--soft)}.ni.on{background:var(--soft);color:var(--pri)}
.nl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);padding:14px 12px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me{display:flex;align-items:center;gap:8px;padding:8px 10px;font-weight:600;font-size:14px}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--pri);color:#fff;font-size:10px;font-weight:700;flex:none}
main{min-width:0}.top{display:flex;align-items:center;gap:12px;padding:14px 28px;position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.tt{flex:1;font-weight:800;font-size:20px;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb{display:none;font-size:22px}
.pg{max-width:1040px;margin:0 auto;padding:24px 28px 80px}
.btn{padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}
.pri{background:var(--pri);color:#fff}.pri:hover{background:var(--prih)}.ghost{border:1px solid var(--line);background:var(--card)}.ghost:hover{border-color:var(--pri)}.dng{color:var(--coral)}
.in{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px}.in:focus{outline:2px solid var(--pri);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;animation:up .35s both}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0001}
.cover{height:96px;padding:12px;display:flex;justify-content:space-between;align-items:flex-start;color:#1F2A37;position:relative}
.pill{font-size:11px;font-weight:700;background:#ffffffaa;border-radius:999px;padding:3px 9px}
.bm{font-size:18px;line-height:1;width:32px;height:32px;border-radius:50%;background:#ffffffaa;color:#1F2A37}
.pn{position:absolute;left:12px;bottom:10px;font-size:12px;font-weight:600}
.cb{padding:12px 14px 14px}.meta{font-size:12px;color:var(--coral);font-weight:700}.cb h3{margin:3px 0 10px;font-size:15px;line-height:1.3;min-height:40px}
.foot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}.foot span:last-child{margin-left:auto}
.c1{background:#F4B6A6}.c2{background:#F3D58B}.c3{background:#CFC3EE}.c4{background:#B7D2F2}.c5{background:#BFE6D2}.c6{background:#F2C4D6}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.hero{background:linear-gradient(135deg,#DDE9D8,#F3E6C8);border-radius:24px;padding:28px;margin-bottom:22px;color:#1F2A37}
[data-theme=dark] .hero{background:linear-gradient(135deg,#27402F,#3B3522);color:#ECEFF1}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;opacity:.7}.hero h1{margin:6px 0 8px;font-size:30px;letter-spacing:-.03em;line-height:1.1;max-width:520px}
.hero em{font-family:Georgia,serif;font-weight:400}.hero p{margin:0 0 16px;opacity:.75;max-width:460px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}.metric b{display:block;font-size:26px;letter-spacing:-.03em}.metric span{font-size:12px;color:var(--mut)}
h2.sec{font-size:18px;letter-spacing:-.02em;margin:22px 0 10px}
.tools{display:flex;gap:8px;margin-bottom:12px}.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;white-space:nowrap}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.panel{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:14px;margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.panel label{font-size:12px;color:var(--mut);display:grid;gap:4px;min-width:150px}
.dh{font-size:13px;font-weight:700;color:var(--mut);margin:20px 0 10px}.more{text-align:center;margin-top:20px}
.empty{padding:36px;text-align:center;color:var(--mut);border:1.5px dashed var(--line);border-radius:18px}
.row{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;flex-wrap:wrap}.grow{flex:1;min-width:0}.mut{color:var(--mut);font-size:12px}
.box{background:var(--soft);border-radius:18px;padding:16px;margin-bottom:16px}.lnk{font-size:12px;color:var(--mut);word-break:break-all;margin:6px 0 10px}
.auth{max-width:400px;margin:0 auto;padding:12vh 20px}.auth h1{font-size:36px;letter-spacing:-.04em;line-height:1.05;margin:10px 0 8px}.auth h1 em{font-family:Georgia,serif;font-weight:400}
.stack{display:grid;gap:10px;margin-top:20px}.two{display:flex;gap:8px}.two .btn{flex:1}
.mo{position:fixed;inset:0;z-index:60;background:#0008;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;animation:up .25s}
.shc{padding:18px 20px;display:flex;justify-content:space-between;gap:12px;color:#1F2A37}.shb{padding:18px 20px 22px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.pgimg{width:100%;border-radius:12px;cursor:zoom-in}.pgimg.z{width:220%;max-width:none;cursor:zoom-out}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:60vh;margin-bottom:8px}
.ent{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;margin-bottom:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.drop{position:relative;display:block;border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--mut);font-size:14px}.drop input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.nt{padding:10px 12px;border-radius:12px;font-size:14px;margin-bottom:6px}.nt.un{background:var(--soft)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw}.hide{display:none}.ov{display:none}
@media(min-width:700px){.mo{align-items:center}.sh{border-radius:22px}}
@media(max-width:860px){.shell{display:block}.side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:50;transform:translateX(-100%);transition:transform .2s}
body.nav .side{transform:none}body.nav .ov{display:block;position:fixed;inset:0;background:#0006;z-index:40}.hb{display:block}.top{padding:12px 16px}.pg{padding:16px 16px 80px}.hero h1{font-size:24px}.grid{grid-template-columns:1fr}}
</style></head>
<body><div id="app"></div><div id="modal"></div><div id="toast" class="hide" data-testid="upload-success-toast"></div>
<script src="config.js"></script>
<script>
const {url:SUPABASE_URL='PASTE_PROJECT_URL_HERE',key:SUPABASE_KEY='PASTE_ANON_KEY_HERE'}=window.STUDYSYNC||{};
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={user:null,name:'',view:'home',comms:[],c:null,tab:'overview',subs:[],notes:[],members:[],term:null,subj:null,stab:'class',notifs:[],flt:'',q:'',f:{cat:'class_note',per:'all'},n:6,showF:false,saved:new Set()};
const CAT={class_note:'Class Notes (Daily)',unit_note:'Unit (Chapter\u2019s Full Notes)',assignment:'Assignment',pyq:'PYQ'};
const tag=c=>c==='unit_note'?'Unit notes':CAT[c]||c;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hide'),3500)};
const go=async f=>{try{await f()}catch(e){toast(e.message||'Something went wrong. Please try again.')}};
const q=async p=>{const{data,error}=await p;if(error)throw error;return data};
const rpc=(n,a)=>q(sb.rpc(n,a));
const staff=()=>S.c&&['admin','cr'].includes(S.c.role),cid=()=>S.c.communities.id;
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const dlabel=d=>d===iso(new Date())?'Today':d===iso(new Date(Date.now()-864e5))?'Yesterday':new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const subName=id=>S.subs.find(s=>s.id===id)?.name||'Subject';
const cov=n=>{let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))%6;return'c'+(h+1)};
const ini=n=>(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const link=()=>location.origin+location.pathname+'#join/'+S.c.communities.join_code;

// ---------- data ----------
const loadComms=async()=>{S.comms=await q(sb.from('members').select('role,status,communities(id,name,type,privacy,branch,join_code)').eq('user_id',S.user.id).neq('status','removed'))};
const loadNotifs=async()=>{S.notifs=await q(sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(40))};
const loadSaved=async()=>{S.saved=new Set((await q(sb.from('saves').select('note_id').eq('user_id',S.user.id))).map(x=>x.note_id))};
const loadNotes=async()=>{S.notes=await q(sb.from('notes').select('id,subject_id,category,unit_no,topic,class_date,helpful_count,is_pinned,uploaded_by,uploader:profiles!notes_uploaded_by_fkey(name),note_files(id)').eq('community_id',cid()).order('class_date',{ascending:false}).order('created_at',{ascending:false}).limit(300))};
async function loadSubs(){const r=await q(sb.from('subjects').select('id,name,term_id,choice_group,terms(name,is_current)').eq('community_id',cid()).eq('is_archived',false).order('sort_order'));S.subs=r.filter(x=>x.terms?.is_current);S.term=S.subs[0]?.term_id||(await q(sb.from('terms').select('id').eq('community_id',cid()).eq('is_current',true).limit(1)))[0]?.id}
const loadMembers=async()=>{S.members=await q(sb.from('members').select('user_id,role,status,profiles(name)').eq('community_id',cid()))};
async function openComm(id){const pg=$('.pg');if(pg)pg.innerHTML='<div class="empty">Loading\u2026</div>';S.c=S.comms.find(m=>m.communities?.id===id);S.view='comm';S.tab='overview';S.subj=null;S.flt='';S.q='';S.n=6;S.f={cat:'class_note',per:'all'};await Promise.all([loadSubs(),loadNotes(),loadMembers()]);draw()}

// ---------- pieces ----------
const card=n=>{const sn=subName(n.subject_id),on=S.saved.has(n.id);return `<article class="card" data-a="note" data-id="${n.id}" data-testid="note-card-${n.id}"><div class="cover ${cov(sn)}"><span class="pill">${tag(n.category)}</span><button class="bm" data-a="bm" data-id="${n.id}" aria-label="Save" data-testid="save-${n.id}">${on?'\u2605':'\u2606'}</button><span class="pn">${n.note_files.length} page${n.note_files.length==1?'':'s'}</span></div><div class="cb"><div class="meta">${esc(sn)}${n.unit_no?' \u00b7 Unit '+n.unit_no:''}</div><h3>${esc(n.topic||'Untitled')}</h3><div class="foot"><span class="av">${ini(n.uploader?.name)}</span><span>${esc(n.uploader?.name||'')}</span><span>${n.helpful_count?'\u2665 '+n.helpful_count:dlabel(n.class_date)}</span></div></div></article>`};
const grid=l=>`<div class="grid">${l.map(card).join('')}</div>`;
const empty=t=>`<div class="empty">${t}</div>`;
function dated(l){if(!l.length)return empty('No notes here yet. Share the first one.');const sh=l.slice(0,S.n),g={};sh.forEach(n=>(g[n.class_date]??=[]).push(n));
return Object.entries(g).map(([d,a])=>`<div class="dh">${dlabel(d)}</div>${grid(a)}`).join('')+(l.length>S.n?`<div class="more"><button class="btn ghost" data-a="more" data-testid="load-more-button">Show more notes</button></div>`:'')}
function units(l){const g={};l.filter(n=>n.unit_no).forEach(n=>(g[n.unit_no]??=[]).push(n));const k=Object.keys(g).sort((a,b)=>a-b);return k.map(u=>`<div class="dh">Unit ${u}</div>${grid(g[u].sort((a,b)=>(b.category==='unit_note')-(a.category==='unit_note')))}`).join('')||empty('Notes that have a unit number appear here.')}
function match(l){const t=S.q.trim().toLowerCase();return t?l.filter(n=>[n.topic,subName(n.subject_id),n.uploader?.name,tag(n.category),n.unit_no?'unit '+n.unit_no:''].join(' ').toLowerCase().includes(t)):l}
function listFor(){let l=S.notes;
if(S.subj){l=l.filter(n=>n.subject_id===S.subj);const s=S.stab;l=s==='class'?l.filter(n=>n.category==='class_note'):s==='assign'?l.filter(n=>n.category==='assignment'):s==='pyq'?l.filter(n=>n.category==='pyq'):s==='imp'?l.filter(n=>n.is_pinned||n.helpful_count>=10):l}
else if(S.tab==='saved')l=l.filter(n=>S.saved.has(n.id));
else{if(S.f.cat!=='all')l=l.filter(n=>n.category===S.f.cat);if(S.flt)l=l.filter(n=>n.subject_id===S.flt);if(S.f.per!=='all')l=l.filter(n=>Date.now()-new Date(n.class_date+'T00:00')<S.f.per*864e5)}
return match(l)}
const body=()=>{const l=listFor();return S.subj&&S.stab==='unit'?units(match(S.notes.filter(n=>n.subject_id===S.subj))):S.tab==='saved'&&!S.subj?(l.length?dated(l):empty('Nothing saved yet. Tap the star on any note to keep it here.')):dated(l)};
const opt=(o,sel)=>o.map(([v,l])=>`<option value="${v}" ${String(v)===String(sel)?'selected':''}>${esc(l)}</option>`).join('');
const tools=f=>`<div class="tools"><input id="q" class="in" data-testid="notes-search-input" placeholder="Search by topic, subject or person" value="${esc(S.q)}">${f?`<button class="btn ghost" data-a="filt" data-testid="filters-button">Filters</button>`:''}</div>${f&&S.showF?`<div class="panel" data-testid="filters-panel"><label>Type<select id="fc" class="in">${opt([['class_note',CAT.class_note],['unit_note',CAT.unit_note],['assignment','Assignments'],['pyq','PYQs']],S.f.cat)}</select></label><button class="btn ghost" data-a="clearf" data-testid="clear-filters-button">Clear filters</button></div>`:''}`;
const tabsBar=(list,cur,a)=>`<div class="chips">${list.map(([k,l])=>`<button class="chip ${cur===k?'on':''}" data-a="${a}" data-t="${k}">${l}</button>`).join('')}</div>`;
const greet=()=>{const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'};

// ---------- views ----------
function authView(){return `<div class="auth"><div class="brand" style="padding:0">Study<b>Sync</b></div><h1>All your class notes, <em>in one place.</em></h1><p style="color:var(--mut);margin:0">Log in and join your class community.</p>
<div class="stack"><input id="nm" class="in" placeholder="Name (new accounts only)"><input id="em" type="email" class="in" placeholder="Email"><input id="pw" type="password" class="in" placeholder="Password (at least 6 characters)">
<div class="two"><button data-a="signin" class="btn pri">Login</button><button data-a="signup" class="btn ghost">Create account</button></div><button data-a="google" class="btn ghost">Continue with Google</button></div></div>`}

function side(){const inC=S.view==='comm',un=S.notifs.filter(n=>!n.is_read).length;
return `<aside class="side"><div class="brand">Study<b>Sync</b></div><div class="nav"><button class="ni ${S.view==='home'?'on':''}" data-a="home" data-testid="nav-home">My communities</button>
${inC?`<div class="nl">${esc(S.c.communities.name||'Community')}</div>${[['overview','Overview'],['classroom','Classroom'],['subjects','Subjects'],['saved','Saved'],['members','Members']].map(([k,l])=>`<button class="ni ${S.tab===k&&!S.subj?'on':''}" data-a="tab" data-t="${k}" data-testid="nav-${k}">${l}</button>`).join('')}`:''}
<button class="ni" data-a="bell" data-testid="nav-alerts">Alerts${un?`<span class="av" style="width:20px;height:20px">${un}</span>`:''}</button></div>
<button class="me" data-a="profile" title="Your profile" style="width:100%;text-align:left"><span class="av">${ini(S.name)}</span><span class="grow" style="overflow:hidden;text-overflow:ellipsis">${esc(S.name)}</span><span class="mut">Profile</span></button><button class="ni" data-a="theme">Light / dark</button><button class="ni" data-a="out">Log out</button></aside>`}

function homeView(){return `<div class="hero"><div class="eyebrow">${greet()}</div><h1>${esc(S.name.split(' ')[0]||'there')}, <em>what are we studying today?</em></h1><p>Open a community to see today's notes, or start a new one for your class or friends.</p>
<div class="tools" style="max-width:420px"><input id="jc" class="in" placeholder="Join code"><button data-a="join" class="btn ghost">Join</button><button data-a="newc" class="btn pri">+ New</button></div></div>
${S.comms.length?`<div class="grid">${S.comms.map(m=>{const c=m.communities;if(!c||m.status!=='active')return `<div class="empty">${esc(c?.name||'Community')} \u00b7 waiting for approval</div>`;
return `<article class="card" style="cursor:default"><div class="cover ${cov(c.name||'x')}" data-a="openc" data-id="${c.id}" style="cursor:pointer"><span class="pill">${esc(c.branch||'')} \u00b7 ${esc(c.privacy)}</span></div><div class="cb"><h3 style="min-height:0">${esc(c.name||'Untitled community')}</h3><div class="foot"><span>Your role: ${m.role==='admin'?'Admin':m.role==='cr'?'CR':'Member'}</span></div><div class="two" style="margin-top:10px"><button class="btn pri" data-a="openc" data-id="${c.id}">Open</button>${m.role==='admin'?`<button class="btn ghost dng" data-a="delc" data-id="${c.id}">Delete</button>`:''}</div></div></article>`}).join('')}</div>`:empty('No communities yet. Create one, or join with a code from a friend.')}`}

function overview(){const me=S.notes.filter(n=>n.uploaded_by===S.user.id),days=new Set(me.map(n=>n.class_date)),wk=S.notes.filter(n=>n.category==='class_note'&&Date.now()-new Date(n.class_date+'T00:00')<7*864e5).length;
let d=new Date(),st=0;if(!days.has(iso(d)))d=new Date(Date.now()-864e5);while(days.has(iso(d))){st++;d=new Date(d-864e5)}
const td=S.notes.filter(n=>n.category==='class_note'&&n.class_date===iso(new Date())),ts=new Set(td.map(n=>n.subject_id)).size;
return `<div class="hero" data-testid="overview-summary"><div class="eyebrow">${greet()}, ${esc(S.name.split(' ')[0])}</div><h1>${td.length?`${td.length} new note${td.length>1?'s':''} today from <em>${ts} subject${ts>1?'s':''}</em>`:'No notes shared <em>yet today</em>'}</h1><p>${td.length?'Catch up in the Classroom, or add what you wrote in class.':'Be the first to share what was taught today.'}</p><div class="two" style="max-width:360px"><button class="btn pri" data-a="upl">Share a note</button><button class="btn ghost" data-a="tab" data-t="classroom" style="background:#fff8;color:inherit">Open Classroom</button></div></div>
<div class="metrics"><div class="metric"><b>${wk}</b><span>Class notes this week</span></div><div class="metric"><b>${me.length}</b><span>Notes you shared</span></div><div class="metric"><b>${[...S.saved].filter(id=>S.notes.some(n=>n.id===id)).length}</b><span>Saved by you</span></div><div class="metric"><b>${st}</b><span>Day sharing streak</span></div></div>
<h2 class="sec">Latest class notes</h2>${(()=>{const l=S.notes.filter(n=>n.category==='class_note');return l.length?grid(l.slice(0,6)):empty('No class notes yet.')})()}`}

function classroom(){return `<div class="eyebrow" style="color:var(--mut);margin-bottom:8px">${S.f.cat==='all'?'All types':CAT[S.f.cat]}${S.f.per!=='all'?' \u00b7 last '+S.f.per+' days':''}</div>${tools(true)}<div class="chips"><button class="chip ${!S.flt?'on':''}" data-a="chip" data-id="">All subjects</button>${S.subs.map(s=>`<button class="chip ${S.flt===s.id?'on':''}" data-a="chip" data-id="${s.id}">${esc(s.name)}</button>`).join('')}</div><div id="grid" data-testid="notes-grid">${body()}</div>`}

function subjects(){return `${S.subs.length?`<div class="grid">${S.subs.map(s=>{const k=S.notes.filter(n=>n.subject_id===s.id).length;return `<article class="card" style="cursor:default"><div class="cover ${cov(s.name)}" data-a="subj" data-id="${s.id}" style="cursor:pointer"><span class="pill">${k} note${k==1?'':'s'}</span></div><div class="cb"><h3 style="min-height:0;cursor:pointer" data-a="subj" data-id="${s.id}">${esc(s.name)}${s.choice_group?' <span class="mut">(option)</span>':''}</h3>${staff()?`<div class="two"><button class="btn ghost" data-a="rensub" data-id="${s.id}">Rename</button><button class="btn ghost" data-a="arch" data-id="${s.id}">Hide</button></div>`:''}</div></article>`}).join('')}</div>`:empty('No subjects yet.')}${staff()?`<div style="margin-top:16px"><button class="btn pri" data-a="addsub">+ Add subject</button></div>`:''}`}

function subjView(){const s=S.subs.find(x=>x.id===S.subj);return `<button class="btn ghost" data-a="subjback" style="margin-bottom:12px">\u2190 Subjects</button><h2 class="sec" style="margin-top:0">${esc(s?.name)}</h2>${tabsBar([['class','Class Notes (Daily)'],['unit','Units'],['assign','Assignments'],['pyq','PYQs'],['imp','Important']],S.stab,'stab')}${tools(false)}<div id="grid">${body()}</div>`}

function members(){const c=S.c.communities;return `<div class="box"><div>Join code: <b style="font-size:20px;letter-spacing:.08em">${esc(c.join_code)}</b></div><div class="lnk">${esc(link())}</div><div class="acts" style="margin:0"><button class="btn ghost" data-a="copy" data-v="${esc(link())}">Copy link</button><a class="btn ghost" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Join the notes group for '+c.name+': '+link())}">WhatsApp</a>${staff()?`<button class="btn ghost" data-a="newcode">Reset code</button>`:''}</div></div>
${S.members.filter(m=>m.status!=='removed').map(m=>`<div class="row"><span class="av">${ini(m.profiles?.name)}</span><div class="grow"><b>${esc(m.profiles?.name||'Student')}</b> <span class="mut">${m.status==='pending'?'wants to join':m.role}</span></div>${staff()&&m.role!=='admin'&&m.user_id!==S.user.id?(m.status==='pending'?`<button class="btn pri" data-a="mstat" data-u="${m.user_id}" data-s="active">Approve</button>`:'')+(S.c.role==='admin'&&m.status==='active'?`<button class="btn ghost" data-a="role" data-u="${m.user_id}" data-r="${m.role==='cr'?'member':'cr'}">${m.role==='cr'?'Remove CR':'Make CR'}</button>`:'')+`<button class="btn ghost" data-a="mstat" data-u="${m.user_id}" data-s="removed">Remove</button>`:''}</div>`).join('')}`}

function commView(){if(S.subj)return subjView();const t=S.tab;return t==='overview'?overview():t==='classroom'?classroom():t==='subjects'?subjects():t==='saved'?`${tools(false)}<div id="grid">${body()}</div>`:members()}
const title=()=>S.view==='home'?'My communities':S.subj?subName(S.subj):{overview:'Overview',classroom:'Classroom',subjects:'Subjects',saved:'Saved notes',members:'Members'}[S.tab];
function draw(){document.body.classList.remove('nav');if(!S.user){$('#app').innerHTML=authView();return}
$('#app').innerHTML=`<div class="shell">${side()}<div class="ov" data-a="menu"></div><main><header class="top"><button class="hb" data-a="menu" aria-label="Menu">\u2630</button><div class="tt">${esc(title())}</div>${S.view==='comm'?`<button class="btn pri" data-a="upl" data-testid="open-upload-button">+ Share a note</button>`:''}</header><section class="pg">${S.view==='home'?homeView():commView()}</section></main></div>`}

// ---------- modal / upload / viewer ----------
const modal=h=>{$('#modal').innerHTML=h?`<div class="mo" data-a="close"><div class="sh">${h}</div></div>`:''};
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal('')});
const entry=()=>`<div class="ent"><div class="g2"><select class="s in">${opt(S.subs.map(s=>[s.id,s.name]),S.subj)}</select><select class="t in">${opt(Object.entries(CAT))}</select></div><div class="g3"><input class="u in" type="number" min="1" placeholder="Unit no. (optional)"><input class="p in" placeholder="Topic, e.g. Partial Differentiation"></div><label class="drop"><input class="f" type="file" multiple accept="image/*,application/pdf"><span class="dt">Drop photos or PDFs here, or tap to choose</span></label></div>`;
async function squash(f){if(!f.type.startsWith('image/'))return f;const b=await createImageBitmap(f),r=Math.min(1,1800/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*r;c.height=b.height*r;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(ok=>c.toBlob(ok,'image/jpeg',.8))}
async function showNote(id){const n=S.notes.find(x=>x.id===id),sn=subName(n.subject_id);
const mine=n.uploaded_by===S.user.id||staff();
const [f,lk,sg]=await Promise.all([q(sb.from('note_files').select('file_path,file_type').eq('note_id',id).order('page_no')),q(sb.from('likes').select('note_id').eq('note_id',id).eq('user_id',S.user.id)),mine?q(sb.from('note_suggestions').select('id,field,new_value,comment,profiles:profiles!note_suggestions_suggested_by_fkey(name)').eq('note_id',id).eq('status','pending')):[]]);
const sgh=sg.length?`<div class="box"><b>Suggested corrections</b>${sg.map(x=>`<div class="row" style="margin:8px 0 0"><div class="grow"><b>${esc(x.profiles?.name||'Someone')}</b> suggests <i>${esc(x.field)}</i>: ${esc(x.new_value||'')}${x.comment?`<div class="mut">${esc(x.comment)}</div>`:''}</div><button class="btn pri" data-a="accsug" data-id="${x.id}" data-n="${id}">Accept</button><button class="btn ghost" data-a="rejsug" data-id="${x.id}" data-n="${id}">Reject</button></div>`).join('')}</div>`:'';
const u=f.length?await q(sb.storage.from('notes').createSignedUrls(f.map(x=>x.file_path),3600)):[],sv=S.saved.has(id);
const pages=f.map((x,i)=>{const url=u[i]?.signedUrl;return x.file_type==='pdf'?`<iframe src="${url}" style="width:100%;height:60vh;border:1px solid var(--line);border-radius:12px"></iframe><p><a href="${url}" download>Download PDF</a></p>`:`<div class="wrap"><img src="${url}" class="pgimg" data-a="zoom" alt="Page ${i+1}"></div><p class="mut"><a href="${url}" download target="_blank" rel="noopener">Download page ${i+1}</a></p>`}).join('');
modal(`<div data-testid="note-detail-modal"><div class="shc ${cov(sn)}"><div><span class="pill">${tag(n.category)}</span><h3 style="margin:8px 0 2px;font-size:20px">${esc(n.topic||'Untitled')}</h3><div style="font-size:13px">${esc(sn)}${n.unit_no?' \u00b7 Unit '+n.unit_no:''} \u00b7 ${dlabel(n.class_date)} \u00b7 ${esc(n.uploader?.name||'')}</div></div><button class="bm" data-a="close">\u2715</button></div>
<div class="shb"><div class="acts"><button class="btn ${sv?'pri':'ghost'}" data-a="bm" data-id="${id}" data-m="1">${sv?'\u2605 Saved':'\u2606 Save'}</button><button class="btn ${lk.length?'pri':'ghost'}" data-a="like" data-id="${id}" data-on="${lk.length?1:0}">\u2665 Helpful</button><button class="btn ghost" data-a="share">Share</button><button class="btn ghost" data-a="sugg" data-id="${id}">Suggest correction</button>${mine?`<button class="btn ghost" data-a="edit" data-id="${id}">Edit</button>`:''}${mine?`<button class="btn ghost dng" data-a="del" data-id="${id}">Delete</button>`:''}</div>${sgh}${pages||empty('This note has no files.')}</div></div>`)}

// ---------- actions ----------
const A={
theme(){const d=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=d;try{localStorage.setItem('theme',d)}catch(e){}},
menu(){document.body.classList.toggle('nav')},
async profile(){const p=await q(sb.from('profiles').select('name,college,branch,year').eq('id',S.user.id).single());
modal(`<div class="shb" data-testid="profile-modal"><h3 style="margin:0 0 12px">Your profile</h3><div class="stack" style="margin:0"><label class="mut">Email</label><input class="in" value="${esc(S.user.email)}" disabled><input id="pn" class="in" placeholder="Display name" value="${esc(p.name)}"><input id="pc" class="in" placeholder="College" value="${esc(p.college)}"><div class="g2"><input id="pbr" class="in" placeholder="Branch" value="${esc(p.branch)}"><input id="py" class="in" placeholder="Year" value="${esc(p.year)}"></div><button data-a="saveprof" class="btn pri">Save profile</button><label class="mut" style="margin-top:8px">Change password</label><input id="np" type="password" class="in" placeholder="New password (at least 6 characters)"><button data-a="savepw" class="btn ghost">Update password</button></div></div>`)},
async saveprof(){const n=$('#pn').value.trim();if(!n)throw new Error('Display name is required');await q(sb.from('profiles').update({name:n,college:$('#pc').value.trim()||null,branch:$('#pbr').value.trim()||null,year:$('#py').value.trim()||null}).eq('id',S.user.id));S.name=n;modal('');draw();toast('Profile saved')},
async savepw(){const p=$('#np').value;if(p.length<6)throw new Error('Password must be at least 6 characters');const{error}=await sb.auth.updateUser({password:p});if(error)throw error;$('#np').value='';toast('Password updated')},
edit({id}){const n=S.notes.find(x=>x.id===id);modal(`<div class="shb"><h3 style="margin:0 0 12px">Edit note</h3><div class="stack" style="margin:0"><div class="g2"><select id="es" class="in">${opt(S.subs.map(s=>[s.id,s.name]),n.subject_id)}</select><select id="et" class="in">${opt(Object.entries(CAT),n.category)}</select></div><div class="g3"><input id="eu" type="number" min="1" class="in" placeholder="Unit no." value="${n.unit_no||''}"><input id="ep" class="in" placeholder="Topic" value="${esc(n.topic)}"></div><input id="ed" type="date" class="in" value="${n.class_date}"><button data-a="saveedit" data-id="${id}" class="btn pri">Save changes</button></div></div>`)},
async saveedit({id}){const u=+$('#eu').value||null;if($('#et').value==='unit_note'&&!u)throw new Error('Enter the unit number for full unit notes');if(!$('#ed').value)throw new Error('Choose the class date');
await q(sb.from('notes').update({subject_id:$('#es').value,category:$('#et').value,unit_no:u,topic:$('#ep').value.trim()||null,class_date:$('#ed').value}).eq('id',id));modal('');await loadNotes();draw();toast('Note updated')},
async accsug({id,n}){await rpc('accept_suggestion',{p_id:id});await loadNotes();await showNote(n);draw();toast('Correction accepted')},
async rejsug({id,n}){const r=prompt('Reason (optional)');await rpc('reject_suggestion',{p_id:id,p_reason:r||null});await showNote(n);toast('Correction rejected')},
async out(){await sb.auth.signOut()},
async signin(){if(!$('#em').value.trim()||!$('#pw').value)throw new Error('Enter your email and password');const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)throw error},
async signup(){if(!$('#em').value.trim())throw new Error('Enter your email');if($('#pw').value.length<6)throw new Error('Password must be at least 6 characters');const{data,error}=await sb.auth.signUp({email:$('#em').value.trim(),password:$('#pw').value,options:{data:{full_name:$('#nm').value.trim()}}});if(error)throw error;if(!data.session)toast('A confirmation link was sent to your email. Open it, then log in.')},
async google(){const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}});if(error)throw error},
home(){S.view='home';S.subj=null;draw()},
openc({id}){return openComm(id)},
tab({t}){S.tab=t;S.subj=null;S.n=6;S.q='';draw()},stab({t}){S.stab=t;S.n=6;draw()},
subj({id}){S.subj=id;S.stab='class';S.q='';S.n=6;draw()},subjback(){S.subj=null;S.tab='subjects';draw()},
chip({id}){S.flt=id;S.n=6;draw()},filt(){S.showF=!S.showF;draw()},clearf(){S.f={cat:'class_note',per:'all'};S.flt='';S.q='';S.n=6;draw()},
more(){S.n+=6;$('#grid').innerHTML=body()},
close(){modal('')},zoom(){},
async bm({id,m}){const on=S.saved.has(id);on?await q(sb.from('saves').delete().eq('note_id',id).eq('user_id',S.user.id)):await q(sb.from('saves').insert({note_id:id,user_id:S.user.id}));on?S.saved.delete(id):S.saved.add(id);if(m)await showNote(id);draw()},
newc(){modal(`<div class="shb"><h3 style="margin:0 0 12px">New community</h3><div class="stack" style="margin:0"><input id="cn" class="in" placeholder="Name: college, branch, year (e.g. CSE-A 2nd Year, XYZ College)"><div class="g2"><select id="ct" class="in">${opt([['division','Division / Batch'],['branch','Branch'],['subject','Subject group'],['friends','Close friends']])}</select><select id="cp" class="in">${opt([['private','Private (needs approval)'],['invite_only','Invite-only (code)'],['public','Public']])}</select></div><div class="g2"><select id="cb" class="in"><option>CSE</option></select><select id="cs" class="in">${[1,2,3,4,5,6,7].map(i=>`<option value="${i}">Sem ${i}</option>`)}</select></div><button data-a="mkc" class="btn pri">Create community</button></div></div>`)},
async mkc(){if(!$('#cn').value.trim())return toast('Enter a community name');const id=await rpc('create_community',{p_name:$('#cn').value,p_type:$('#ct').value,p_privacy:$('#cp').value,p_course:'Engineering',p_branch:$('#cb').value,p_term_no:+$('#cs').value});modal('');await loadComms();toast('Community created');await openComm(id)},
async join(){await joinCode($('#jc').value)},
async delc({id}){const nm=S.comms.find(x=>x.communities?.id===id)?.communities?.name||'this community';
if(!confirm('Delete "'+nm+'" permanently? All its subjects, notes and files will be removed for everyone. This cannot be undone.'))return;
const f=await q(sb.from('note_files').select('file_path,notes!inner(community_id)').eq('notes.community_id',id));const p=f.map(x=>x.file_path);
for(let i=0;i<p.length;i+=100){const{error}=await sb.storage.from('notes').remove(p.slice(i,i+100));if(error)throw error}
await q(sb.from('communities').delete().eq('id',id));await loadComms();draw();toast('Community deleted')},
upl(){if(!S.subs.length)return toast('Add subjects first (Subjects tab)');modal(`<div class="shb" data-testid="upload-modal"><h3 style="margin:0 0 12px">Share a note</h3><label class="mut">Class date</label><input id="ud" type="date" class="in" style="margin-bottom:12px" value="${iso(new Date())}"><div id="ents">${entry()}</div><div id="prog" class="hide" style="margin-top:12px"><div style="height:8px;border-radius:99px;background:var(--line);overflow:hidden"><div id="upb" style="height:100%;width:0;background:var(--pri);transition:width .2s"></div></div><div id="upt" class="mut" style="margin-top:4px"></div></div><div class="acts" style="margin:12px 0 0"><button data-a="addent" class="btn ghost">+ Add another subject</button><button data-a="doupl" id="ub" class="btn pri" style="flex:1" data-testid="upload-submit-button">Share note</button></div></div>`)},
addent(){$('#ents').insertAdjacentHTML('beforeend',entry())},
async doupl(){const btn=$('#ub'),batch=crypto.randomUUID(),uid=S.user.id;btn.disabled=true;btn.textContent='Uploading...';let n=0;
try{for(const e of $$('.ent')){if(e.querySelector('.f').files.length&&e.querySelector('.t').value==='unit_note'&&!+e.querySelector('.u').value)throw new Error('Enter the unit number for full unit notes')}
const all=$$('.f').reduce((a,i)=>a+i.files.length,0);let done=0;$('#prog').classList.remove('hide');const prog=()=>{$('#upb').style.width=Math.round(done/(all||1)*100)+'%';$('#upt').textContent='Uploaded '+done+' of '+all+' files'};prog();
for(const e of $$('.ent')){const files=[...e.querySelector('.f').files];if(!files.length)continue;
const row=await q(sb.from('notes').insert({community_id:cid(),subject_id:e.querySelector('.s').value,uploaded_by:uid,category:e.querySelector('.t').value,unit_no:+e.querySelector('.u').value||null,topic:e.querySelector('.p').value.trim()||null,class_date:$('#ud').value,upload_batch_id:batch}).select('id').single());
for(const[i,f]of files.entries()){if(f.size>20971520)throw new Error(f.name+' is larger than 20 MB');const b=await squash(f),pdf=f.type==='application/pdf',path=`${cid()}/${uid}/${crypto.randomUUID()}.${pdf?'pdf':'jpg'}`;
const{error}=await sb.storage.from('notes').upload(path,b,{contentType:pdf?'application/pdf':'image/jpeg'});if(error)throw error;
await q(sb.from('note_files').insert({note_id:row.id,file_path:path,file_type:pdf?'pdf':'image',page_no:i+1,size_bytes:b.size}));done++;prog()}n++}
if(!n)throw new Error('Choose at least one file with a subject');await rpc('publish_upload',{p_batch:batch});modal('');await loadNotes();if(!S.subj)S.tab='classroom';draw();toast('Notes uploaded. Everyone was notified.')}
finally{btn.disabled=false;btn.textContent='Share note'}},
note({id}){return showNote(id)},
async like({id,on}){on==='1'?await q(sb.from('likes').delete().eq('note_id',id).eq('user_id',S.user.id)):await q(sb.from('likes').insert({note_id:id,user_id:S.user.id}));await loadNotes();await showNote(id);draw()},
async share(){const t='Join the notes group for '+S.c.communities.name+': '+link();if(navigator.share){try{await navigator.share({text:t})}catch(e){}}else{await navigator.clipboard.writeText(t);toast('Invite link copied')}},
async sugg({id}){const f=prompt('What is wrong? Type one of: topic, unit, date, other');if(!['topic','unit','date','other'].includes((f||'').trim()))return;const v=prompt(f==='date'?'Correct date (YYYY-MM-DD)':'Correct value / what is wrong');if(!v)return;await q(sb.from('note_suggestions').insert({note_id:id,suggested_by:S.user.id,field:f.trim(),new_value:v}));toast('Suggestion sent to the uploader')},
async del({id}){if(!confirm('Delete this note?'))return;await rpc('delete_note',{p_id:id});modal('');await loadNotes();draw()},
async role({u,r}){await rpc('set_member_role',{p_community:cid(),p_user:u,p_role:r});await loadMembers();draw()},
async mstat({u,s}){await rpc('set_member_status',{p_community:cid(),p_user:u,p_status:s});await loadMembers();draw()},
copy({v}){navigator.clipboard.writeText(v);toast('Link copied')},
async newcode(){const c=await rpc('reset_join_code',{p_community:cid()});S.c.communities.join_code=c;draw();toast('New code created. The old one no longer works.')},
async addsub(){const n=prompt('Subject name');if(!n)return;await q(sb.from('subjects').insert({term_id:S.term,community_id:cid(),name:n.trim(),created_by:S.user.id,sort_order:99}));await loadSubs();draw()},
async rensub({id}){const n=prompt('New name',subName(id));if(!n)return;await q(sb.from('subjects').update({name:n.trim()}).eq('id',id));await loadSubs();draw()},
async arch({id}){if(!confirm('Hide this subject? Its notes stay safe.'))return;await q(sb.from('subjects').update({is_archived:true}).eq('id',id));await loadSubs();draw()},
async bell(){await loadNotifs();modal(`<div class="shb"><div class="acts" style="justify-content:space-between"><h3 style="margin:0">Alerts</h3><button class="btn ghost" data-a="close">Close</button></div>${S.notifs.map(n=>`<div class="nt ${n.is_read?'':'un'}">${esc(n.message)}<div class="mut">${new Date(n.created_at).toLocaleString('en-IN')}</div></div>`).join('')||empty('No alerts yet.')}</div>`);await q(sb.from('notifications').update({is_read:true}).eq('user_id',S.user.id).eq('is_read',false));S.notifs.forEach(n=>n.is_read=true);draw()}
};
async function joinCode(code){if(!code.trim())return toast('Enter a join code');const r=await rpc('join_community',{p_code:code});await loadComms();toast(r.status==='pending'?'Request sent. Wait for approval.':'Joined the community');S.view='home';draw();if(r.status==='active')await openComm(r.community_id)}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||!A[b.dataset.a])return;if(b.dataset.a==='close'&&e.target!==b&&!b.matches('button'))return;if(b.dataset.a==='zoom'){b.classList.toggle('z');return}if(b.dataset.a==='tab'||b.dataset.a==='home')document.body.classList.remove('nav');go(()=>A[b.dataset.a](b.dataset))});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;S.n=6;$('#grid').innerHTML=body()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='fc'){S.f.cat=t.value;S.n=6;draw()}if(t.id==='fp'){S.f.per=t.value;S.n=6;draw()}
if(t.classList.contains('f')){const n=t.files.length;t.parentElement.querySelector('.dt').textContent=n?n+' file'+(n>1?'s':'')+' selected':'Drop photos or PDFs here, or tap to choose'}});

async function boot(){if(!S.user){draw();return}await go(async()=>{await Promise.all([loadComms(),loadNotifs(),loadSaved()]);S.name=(await q(sb.from('profiles').select('name').eq('id',S.user.id).single())).name||'Student';S.view='home';draw();const h=location.hash;if(h.startsWith('#join/')){history.replaceState(null,'',location.pathname);await joinCode(h.slice(6))}})}
try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
if(SUPABASE_URL.startsWith('PASTE')){$('#app').innerHTML='<div class="auth">Open <b>config.js</b>, paste your Supabase URL and key, save, then reload this page.</div>'}
else sb.auth.onAuthStateChange((ev,ses)=>{const u=ses?.user||null;if(u?.id===S.user?.id&&ev!=='INITIAL_SESSION')return;S.user=u;setTimeout(boot,0)});
</script></body></html>
